apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: trading-system
  labels:
    app: mysql
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  clusterIP: None  # 无头服务，用于 StatefulSet
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: trading-system
  labels:
    app: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: trading_db
            - name: MYSQL_USER
              value: trading
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-secret
                  key: mysql-password
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          # 资源限制：保证 QoS Burstable（既有 requests < limits
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # 存活探针：检查 MySQL 是否存活
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
            initialDelaySeconds: 30
            periodSeconds: 10
          # 就绪探针：检查 MySQL 是否可用
          readinessProbe:
            exec:
              command: ["mysql", "-h", "localhost", "-u", "trading", "-ptrading123", "-e", "SELECT 1"]
            initialDelaySeconds: 15
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
