apiVersion: v1
kind: Service
metadata:
  name: trading-app
  namespace: trading-system
  labels:
    app: trading-app
spec:
  selector:
    app: trading-app
  ports:
    - name: metrics
      port: 2112
      targetPort: 2112
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-app
  namespace: trading-system
  labels:
    app: trading-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: trading-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2112"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: trading-app
          image: trading-system:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_DSN
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: DB_DSN
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: REDIS_ADDR
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: PORT
          ports:
            - name: metrics
              containerPort: 2112
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # 存活探针：检查应用是否还在运行，失败则重启
          livenessProbe:
            httpGet:
              path: /health
              port: 2112
            initialDelaySeconds: 10  # 启动后等待 10s 再开始检查
            periodSeconds: 15        # 每 15s 检查一次
            timeoutSeconds: 3        # 3s 超时
            failureThreshold: 3      # 连续 3 次失败才重启
          # 就绪探针：检查应用是否可以接收流量，失败则从 Service 摘除
          readinessProbe:
            httpGet:
              path: /ready
              port: 2112
            initialDelaySeconds: 5   # 启动后等待 5s 开始检查
            periodSeconds: 10        # 每 10s 检查一次
            timeoutSeconds: 3        # 3s 超时
            failureThreshold: 3      # 连续 3 次失败则未就绪
            successThreshold: 1      # 成功 1 次即就绪
          # 启动探针：应用启动慢时用，保证启动时间充足
          startupProbe:
            httpGet:
              path: /health
              port: 2112
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30     # 给 2.5min 启动时间
