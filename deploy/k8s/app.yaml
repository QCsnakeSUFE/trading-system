apiVersion: v1
kind: Service
metadata:
  name: trading-app
  namespace: trading-system
  labels:
    app: trading-app
spec:
  selector:
    app: trading-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-app
  namespace: trading-system
  labels:
    app: trading-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trading-app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: trading-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: trading-app
          image: trading-system:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_DSN
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: DB_DSN
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: REDIS_ADDR
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: trading-config
                  key: PORT
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
